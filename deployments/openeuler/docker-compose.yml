# =============================================================================
# IBMCP 开发环境 Docker Compose —— PG15 / Redis / Node-RED
# 用法：cd /home/meng/ibmcp && docker compose -f deployments/openeuler/docker-compose.yml up -d
#
# 本文件只管三个纯服务容器（PG / Redis / Node-RED）。
# FastAPI + C++ 扩展 + Nginx 必须裸机跑（见 08 号文档 §1.3）。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15 —— 时序数据 + 配置 + 运行态
  # 口径与 backend/.env.example / app/core/config.py 完全一致：
  #   PG_USER=ibmcp  PG_PASSWORD=ibmcp  PG_DATABASE=ibmcp  PG_PORT=5432
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: ibmcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibmcp
      POSTGRES_PASSWORD: ibmcp
      POSTGRES_DB: ibmcp
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ibmcp -d ibmcp" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 —— 会话 / 缓存 / 实时推送
  # 口径与 .env.example 一致：REDIS_URL=redis://127.0.0.1:6379/0
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: ibmcp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Node-RED —— PLC 模拟器 / 协议探针 / 数据导出（联调辅助）
  # 浏览器访问 http://192.168.80.134:1880
  # ---------------------------------------------------------------------------
  nodered:
    image: nodered/node-red:latest
    container_name: ibmcp-nodered
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
    name: ibmcp_pg_data
  redis_data:
    name: ibmcp_redis_data
  nodered_data:
    name: ibmcp_nodered_data