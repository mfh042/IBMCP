# =============================================================================
# IBMCP Docker Compose —— PG15 / Redis / Node-RED（纯服务容器）
# 用法：docker compose -f deployments/openeuler/docker-compose.yml up -d
#
# 本文件只管三个纯服务容器。
# Drogon C++ 后端 + Nginx 必须裸机跑（直接访问宿主 libpq 与协议驱动库）。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15 —— 时序数据 + 配置 + 运行态
  # 连接口径与 backend/config.json 完全一致：
  #   host=127.0.0.1  port=5432  user=ibmcp  passwd=ibmcp  dbname=ibmcp
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: ibmcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibmcp
      POSTGRES_PASSWORD: ibmcp
      POSTGRES_DB: ibmcp
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ibmcp -d ibmcp" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 —— 会话 / 缓存 / 实时推送
  # 口径与 .env.example 一致：REDIS_URL=redis://127.0.0.1:6379/0
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: ibmcp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Node-RED —— PLC 模拟器 / 协议探针 / 数据导出 / 告警联动（编排扩展层）
  # 编辑器   http://192.168.80.136:1880  （已启用 adminAuth 登录）
  # Modbus 从站 0.0.0.0:1502             （模拟器流，供后端采集器连接）
  # ---------------------------------------------------------------------------
  nodered:
    image: nodered/node-red:latest
    container_name: ibmcp-nodered
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "1880:1880"
      - "1502:1502"   # Modbus TCP 模拟器从站端口（后端采集器连此）
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 流内可用 host.docker.internal 访问宿主后端
    volumes:
      - nodered_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
    name: ibmcp_pg_data
  redis_data:
    name: ibmcp_redis_data
  nodered_data:
    name: ibmcp_nodered_data