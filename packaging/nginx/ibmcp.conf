server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 50m;
    root /home/meng/ibmcp/frontend-dist;
    index index.html;

    location /ws/push {
        proxy_pass http://127.0.0.1:8000/ws/push;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/v1/ws/collect {
        proxy_pass http://127.0.0.1:8000/api/v1/ws/collect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node-RED 编辑器同源反代：透传 /nodered/ 前缀到容器 1880，含编辑器 WS（/nodered/comms）。
    # 前端 iframe 以 src="/nodered/" 嵌入；Node-RED settings.js 需设 httpAdminRoot: '/nodered'。
    location /nodered/ {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}